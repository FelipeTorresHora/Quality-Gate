name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pr_quality
          POSTGRES_PASSWORD: pr_quality
          POSTGRES_DB: pr_quality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://pr_quality:pr_quality@localhost:5432/pr_quality_test
      DATABASE_URL: postgresql+psycopg://pr_quality:pr_quality@localhost:5432/pr_quality_test
      PR_QUALITY_ENV_FILE: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check migrations apply cleanly
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
