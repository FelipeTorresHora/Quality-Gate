name: Graphify

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "docs/**"
      - ".graphifyignore"
      - ".github/workflows/graphify.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "docs/**"
      - ".graphifyignore"
      - ".github/workflows/graphify.yml"

concurrency:
  group: graphify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    name: Knowledge graph (AST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install graphify
        run: uv tool install graphifyy

      - name: Rebuild code graph
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          graphify extract . --code-only --no-viz
          graphify cluster-only . --no-label --no-viz

      - name: Assert graphify-out matches repository
        run: |
          # GRAPH_REPORT.md embeds HEAD; only graph.json + manifest.json are stable checks.
          git diff --exit-code \
            graphify-out/graph.json \
            graphify-out/manifest.json \
            || {
              echo "::error::graphify-out is stale. Run: graphify extract . --code-only && graphify cluster-only . --no-label"
              echo "Then commit graphify-out/graph.json and graphify-out/manifest.json. See docs/graphify.md."
              exit 1
            }
