name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pr_quality
          POSTGRES_PASSWORD: pr_quality
          POSTGRES_DB: pr_quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr_quality -d pr_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pr_quality:pr_quality@localhost:5432/pr_quality_test
      PR_QUALITY_ENV_FILE: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Create test database
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://pr_quality:pr_quality@localhost:5432/pr_quality",
              autocommit=True,
          ) as conn:
              row = conn.execute(
                  "SELECT 1 FROM pg_database WHERE datname = %s",
                  ("pr_quality_test",),
              ).fetchone()
              if row is None:
                  conn.execute("CREATE DATABASE pr_quality_test")
          PY

      - name: Run pytest
        working-directory: backend
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee pytest-output.txt
          summary="$(tail -1 pytest-output.txt)"
          passed="$(printf '%s' "$summary" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | tail -1 || true)"
          skipped="$(printf '%s' "$summary" | grep -oE '[0-9]+ skipped' | grep -oE '[0-9]+' | tail -1 || true)"
          passed="${passed:-0}"
          skipped="${skipped:-0}"
          if [ "$skipped" -gt 0 ] && [ "$passed" -eq 0 ]; then
            echo "::error::All runnable tests were skipped (PostgreSQL likely unavailable)."
            exit 1
          fi

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
